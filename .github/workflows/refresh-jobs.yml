name: Refresh job data

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: 'Override LM_SOURCES (e.g. "indeed,seek"). Empty = weekday schedule.'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Weekday schedule for the paid Apify sources (Free plan budget):
      # LinkedIn Mon/Wed/Fri · Indeed Tue/Thu · Seek Sat+Tue. Sun = `none`
      # (sentinel: an EMPTY LM_SOURCES would mean "run ALL sources" in ingest).
      - name: Pick Apify sources for today
        id: sources
        run: |
          case $(date +%u) in
            1) s=linkedin ;;      # Mon
            2) s=indeed,seek ;;   # Tue
            3) s=linkedin ;;      # Wed
            4) s=indeed ;;        # Thu
            5) s=linkedin ;;      # Fri
            6) s=seek ;;          # Sat
            7) s=none ;;          # Sun — keyless sources only
          esac
          if [[ -n "${{ inputs.sources }}" ]]; then
            s="${{ inputs.sources }}"
          fi
          echo "value=$s" >> "$GITHUB_OUTPUT"
          echo "LM_SOURCES=$s"

      - name: Ingest job boards
        run: node scripts/ingest.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          LM_SOURCES: ${{ steps.sources.outputs.value }}

      - name: Commit refreshed feed (if changed)
        run: |
          git config user.name "labormin-bot"
          git config user.email "bot@labormin.com"
          if [[ -n "$(git status --porcelain src/data/jobs.json src/data/translation-cache.json src/data/ingest-flags.json)" ]]; then
            git add src/data/jobs.json src/data/translation-cache.json src/data/ingest-flags.json
            git commit -m "chore(data): refresh jobs feed"
            git push
          else
            echo "No changes in jobs feed"
          fi

      # El deploy lo dispara Workers Builds (Git-connected) con cada push.
